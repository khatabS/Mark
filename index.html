<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام إدارة المدرسة</title>

<style>

body{
    font-family:Tahoma;
    background:#f4f6f9;
    margin:0;
}

.container{
    width:350px;
    margin:100px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#1e3a8a;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.dashboard{
    display:none;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

.logout{
    background:red;
}

</style>
</head>

<body>

<div class="container" id="loginBox">

    <h2>تسجيل الدخول</h2>

    <input type="text" id="username" placeholder="اسم المستخدم">

    <input type="password" id="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>

</div>

<div class="dashboard" id="dashboard">

    <h2 id="welcome"></h2>

    <div class="card">
        <h3>إدارة الطلاب</h3>
        <p>إضافة وتعديل الطلاب</p>
    </div>

    <div class="card">
        <h3>الدرجات</h3>
        <p>إدخال وعرض الدرجات</p>
    </div>

    <div class="card">
        <h3>الحضور والغياب</h3>
        <p>تسجيل الحضور اليومي</p>
    </div>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

</div>

<script src="app.js"></script>

</body>
</html>
