<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام المدرسة</title>
</head>
<body>

<h1>نظام إدارة المدرسة</h1>

<div id="app"></div>

<script src="app.js">
    document.getElementById("app").innerHTML = `
<h2>مرحباً بك</h2>

<button onclick="showUsers()">
عرض المستخدمين
</button>

<div id="result"></div>
`;

const users = [
{
name:"المدير",
role:"Admin"
}
];

function showUsers(){

document.getElementById("result").innerHTML =
users.map(x=>`
<p>${x.name} - ${x.role}</p>
`).join("");

}

</script>

</body>
</html>
